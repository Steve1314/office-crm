name: Build iOS App (.ipa)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci || npm install

      - name: Build Web Application & Sync iOS
        working-directory: ./client
        run: npm run build:ios

      - name: Verify Xcode & Swift Environment
        run: |
          xcodebuild -version
          swift -version

      - name: Build Xcode Project
        working-directory: ./client/ios/App
        run: |
          xcodebuild clean build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .app into .ipa
        working-directory: ./client/ios/App
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find derived_data/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: App bundle not found!"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r OfficeCRM.ipa Payload
          echo "Successfully packaged OfficeCRM.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfficeCRM-iOS-IPA
          path: client/ios/App/build/OfficeCRM.ipa
          retention-days: 14
